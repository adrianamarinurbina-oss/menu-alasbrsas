<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A Las Brasas - Menú Digital</title>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Poppins:wght@300;400;600;800&display=swap" rel="stylesheet">
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    font-family: 'Poppins', sans-serif;
    background: linear-gradient(135deg, #121212 0%, #1a1a1a 100%);
    background-attachment: fixed;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    color: #fff;
    position: relative;
    overflow-x: hidden;
  }

  /* Efecto de fondo animado */
  body::before {
    content: '';
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: radial-gradient(circle at 20% 50%, rgba(255, 87, 34, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(216, 67, 21, 0.1) 0%, transparent 50%);
    pointer-events: none;
    z-index: 0;
  }

  .container {
    position: relative;
    z-index: 1;
    text-align: center;
    max-width: 500px;
    width: 90%;
  }

  /* Header con logo */
  .header-section {
    margin-bottom: 50px;
    animation: slideDown 0.6s ease-out;
  }

  .logo-titulo {
    font-family: 'Oswald', sans-serif;
    font-size: 3rem;
    font-weight: 700;
    letter-spacing: 3px;
    text-transform: uppercase;
    background: linear-gradient(to right, #ff5722, #ff9100);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    text-shadow: 0 2px 20px rgba(255, 87, 34, 0.3);
    margin-bottom: 10px;
  }

  .subtitle {
    color: #aaa;
    font-size: 1rem;
    letter-spacing: 1px;
    text-transform: uppercase;
    margin-bottom: 30px;
  }

  .title-landing {
    color: #fff;
    font-size: 1.3rem;
    font-weight: 300;
    letter-spacing: 2px;
    margin-bottom: 40px;
    text-transform: uppercase;
  }

  /* Tarjetas de opciones */
  .options-container {
    display: flex;
    flex-direction: column;
    gap: 20px;
    animation: slideUp 0.8s ease-out;
  }

  .option-card {
    background: linear-gradient(135deg, #1e1e1e 0%, #2a2a2a 100%);
    border-radius: 20px;
    padding: 30px 25px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: space-between;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    text-decoration: none;
    color: #fff;
    transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    border: 2px solid transparent;
    position: relative;
    overflow: hidden;
  }

  .option-card::before {
    content: '';
    position: absolute;
    top: 0;
    left: -100%;
    width: 100%;
    height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.1), transparent);
    transition: left 0.5s;
  }

  .option-card:hover::before {
    left: 100%;
  }

  .option-card:hover {
    transform: translateY(-5px) scale(1.02);
    box-shadow: 0 15px 40px rgba(255, 87, 34, 0.3);
  }

  .option-card:active {
    transform: scale(0.98);
  }

  .delivery-btn {
    border-color: #ff5722;
    background: linear-gradient(135deg, rgba(255, 87, 34, 0.1) 0%, rgba(216, 67, 21, 0.05) 100%);
  }

  .delivery-btn:hover {
    background: linear-gradient(135deg, rgba(255, 87, 34, 0.2) 0%, rgba(216, 67, 21, 0.1) 100%);
    border-color: #ff9100;
  }

  .dine-in-btn {
    border-color: #4caf50;
    background: linear-gradient(135deg, rgba(76, 175, 80, 0.1) 0%, rgba(56, 142, 60, 0.05) 100%);
  }

  .dine-in-btn:hover {
    background: linear-gradient(135deg, rgba(76, 175, 80, 0.2) 0%, rgba(56, 142, 60, 0.1) 100%);
    border-color: #66bb6a;
  }

  .card-content {
    flex: 1;
    text-align: left;
  }

  .card-content h3 {
    margin: 0 0 8px 0;
    font-size: 1.4rem;
    font-weight: 600;
    font-family: 'Oswald', sans-serif;
    letter-spacing: 1px;
  }

  .card-content small {
    color: #aaa;
    font-size: 0.95rem;
    display: block;
  }

  .card-icon {
    font-size: 48px;
    margin-left: 20px;
    transition: transform 0.3s;
  }

  .option-card:hover .card-icon {
    transform: scale(1.2) rotate(10deg);
  }

  /* Animaciones */
  @keyframes slideDown {
    from {
      opacity: 0;
      transform: translateY(-30px);
    }
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }

  @keyframes slideUp {
    from {
      opacity: 0;
      transform: translateY(30px);
    }
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }

  /* Responsive */
  @media (max-width: 480px) {
    .logo-titulo {
      font-size: 2.2rem;
      letter-spacing: 2px;
    }

    .option-card {
      padding: 25px 20px;
    }

    .card-content h3 {
      font-size: 1.2rem;
    }

    .card-icon {
      font-size: 40px;
      margin-left: 15px;
    }
  }

</style>
</head>
<body>

  <div class="container">
    <div class="header-section">
      <div class="logo-titulo">🔥 A LAS BRASAS</div>
      <div class="subtitle">Asados Artesanales</div>
    </div>

    <h2 class="title-landing">¿Cómo ordenas hoy?</h2>

    <div class="options-container">
      <a href="A Domicilio.html" class="option-card delivery-btn">
        <div class="card-content">
          <h3>A Domicilio</h3>
          <small>Entrega rápida a tu puerta</small>
        </div>
        <div class="card-icon">🛵</div>
      </a>

      <a href="comer aqui.html" class="option-card dine-in-btn">
        <div class="card-content">
          <h3>Comer Aquí</h3>
          <small>Servicio a la mesa</small>
        </div>
        <div class="card-icon">🍽️</div>
      </a>
    </div>
  </div>

</body>
</html>
