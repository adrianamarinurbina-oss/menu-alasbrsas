<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>✅ ¡Pedido Confirmado! - A Las Brasas</title>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0; font-family: 'Poppins', sans-serif;
            background-color: #121212;
            background-image: radial-gradient(#222 1px, transparent 1px);
            background-size: 20px 20px; color: #fff;
            display: flex; align-items: center; justify-content: center; min-height: 100vh;
        }
        .container {
            text-align: center; background: rgba(30, 30, 30, 0.9);
            padding: 40px; border-radius: 30px; border: 2px solid #4caf50;
            max-width: 500px; width: 90%; box-shadow: 0 15px 50px rgba(0,0,0,0.8);
        }
        .icon { font-size: 80px; margin-bottom: 20px; }
        h1 { font-family: 'Oswald', sans-serif; color: #4caf50; text-transform: uppercase; margin: 0; }
        p { color: #ccc; margin: 15px 0; }
        .ticket {
            background: #1e1e1e; padding: 20px; border-radius: 15px;
            margin: 25px 0; border: 1px dashed #444; text-align: left;
        }
        .ticket-item { display: flex; justify-content: space-between; font-size: 0.9rem; margin-bottom: 5px; }
        .btn {
            display: block; background: linear-gradient(135deg, #4caf50, #2e7d32);
            color: white; text-decoration: none; padding: 15px;
            border-radius: 12px; font-weight: bold; transition: 0.3s;
        }
        .btn:hover { transform: scale(1.05); filter: brightness(1.2); }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon">🔥</div>
        <h1>¡Pedido en camino!</h1>
        <p>Tu pago ha sido procesado con éxito. Ya estamos preparando tus brasas.</p>
        
        <div class="ticket">
            <div class="ticket-item">
                <span>Estado:</span> <strong style="color: #4caf50;">Aprobado</strong>
            </div>
            <div class="ticket-item">
                <span>Orden ID:</span> <span id="payment-id">Cargando...</span>
            </div>
        </div>

        <p style="font-size: 0.85rem; color: #888;">Recibirás un mensaje de confirmación adicional vía WhatsApp.</p>
        
      <a href="index.html?v=1.1" class="btn">VOLVER AL INICIO</a>
    </div>

    <script>
        // Capturamos el ID del pago que Mercado Pago envía en la URL
        const urlParams = new URLSearchParams(window.location.search);
        const paymentId = urlParams.get('payment_id');
        
        if (paymentId) {
            document.getElementById('payment-id').innerText = "#" + paymentId;
        } else {
            document.getElementById('payment-id').innerText = "Venta Directa";
        }
    </script>
</body>
</html>
